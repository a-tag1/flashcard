<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Flashcards</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* =========================================
           テーマ定義 (CSS Custom Properties)
        ========================================= */
        :root {
            --bg-base: #f3f4f6;
            --bg-card: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.85);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --border: #e5e7eb;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-flip: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .theme-dark {
            --bg-base: #111827;
            --bg-card: #1f2937;
            --bg-nav: rgba(31, 41, 55, 0.85);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-light: rgba(99, 102, 241, 0.2);
            --border: #374151;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --shadow-flip: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color-scheme: dark;
        }

        .theme-pastel {
            --bg-base: #fdf4f5;
            --bg-card: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.9);
            --text-main: #57534e;
            --text-muted: #a8a29e;
            --primary: #f472b6;
            --primary-light: #fce7f3;
            --border: #f5d0fe;
            --shadow-card: 0 10px 25px -5px rgba(244, 114, 182, 0.1);
            --shadow-flip: 0 25px 50px -12px rgba(244, 114, 182, 0.2);
        }

        .theme-neon {
            --bg-base: #09090b;
            --bg-card: #18181b;
            --bg-nav: rgba(24, 24, 27, 0.85);
            --text-main: #ecfeff;
            --text-muted: #a1a1aa;
            --primary: #22d3ee;
            --primary-light: rgba(34, 211, 238, 0.15);
            --border: #22d3ee;
            --shadow-card: 0 0 15px rgba(34, 211, 238, 0.2);
            --shadow-flip: 0 0 40px rgba(34, 211, 238, 0.4);
            color-scheme: dark;
        }

        /* =========================================
           グローバルスタイル
        ========================================= */
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-nav {
            background-color: var(--bg-nav);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
        }

        .app-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }

        .input-styled {
            background-color: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        .input-styled:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* フォント定義 */
        .font-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .font-serif { font-family: ui-serif, Georgia, Cambria, serif; }
        .font-rounded { font-family: 'Quicksand', 'Varela Round', system-ui, sans-serif; letter-spacing: 0.02em; }
        .font-jp-gothic { font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
        .font-jp-mincho { font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS PMincho", serif; }

        /* =========================================
           3D フリップアニメーション
        ========================================= */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-inner {
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); /* バウンドするような心地よいイージング */
        }
        .flashcard-surface {
            box-shadow: var(--shadow-flip);
        }

        /* スクロールバー非表示 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* モーダルのフェードイン */
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans">

    <!-- ヘッダー -->
    <header class="pt-6 pb-4 px-6 flex justify-between items-center z-10 shrink-0">
        <h1 class="text-2xl font-extrabold tracking-tight" style="color: var(--primary);">FLASHCARDS</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 overflow-y-auto no-scrollbar px-5 pb-28 relative" id="main-content">
        
        <!-- ==========================================
             View 1: Learn (プレイリスト選択)
        =========================================== -->
        <div id="view-learn" class="space-y-6 pb-8 view-section">
            <h2 class="text-lg font-semibold text-[var(--text-muted)]">SMALL STEP</h2>
            <div id="learn-playlist-container" class="grid grid-cols-1 gap-5">
                <!-- JS生成 -->
            </div>
        </div>

        <!-- ==========================================
             View 1-b: Study (学習画面)
        =========================================== -->
        <div id="view-study" class="hidden h-full flex flex-col view-section">
            <!-- ヘッダーコントロール -->
            <div class="mb-4 space-y-3 shrink-0">
                <div class="flex justify-between items-center">
                    <button onclick="navigate('learn')" class="flex items-center gap-1 py-2 font-medium text-[var(--text-muted)] hover:text-[var(--primary)] transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        戻る
                    </button>
                    <div class="flex items-center gap-2">
                        <button id="toggle-random" onclick="toggleRandomPlayback()" aria-label="ランダム再生を有効にする" aria-pressed="false" title="ランダム再生" class="p-2 rounded-full app-card hover:scale-110 active:scale-95 transition-transform text-[var(--text-muted)]">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 3h4v4M3 7h2c5 0 7 10 12 10h4m-4-4 4 4-4 4M3 17h2c1.5 0 2.7-1 4-2.5M17 7c.7-.7 1.4-1 2-1h2"></path></svg>
                        </button>
                        <div class="px-3 py-1 rounded-full text-sm font-semibold app-card" id="study-progress">1 / 10</div>
                    </div>
                </div>
                <!-- フィルター -->
                <div class="flex gap-3">
                    <select id="filter-mastery" onchange="applyFilters()" class="flex-1 input-styled rounded-xl p-2.5 text-sm appearance-none bg-no-repeat bg-[right_0.75rem_center] bg-[length:1em_1em]" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%236b7280%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E');">
                        <option value="all">全習得率</option>
                        <option value="0">0%</option>
                        <option value="10">10%</option>
                        <option value="20">20%</option>
                        <option value="30">30%</option>
                        <option value="40">40%</option>
                        <option value="50">50%</option>
                        <option value="60">60%</option>
                        <option value="70">70%</option>
                        <option value="80">80%</option>
                        <option value="90">90%</option>
                        <option value="100">100%</option>
                    </select>
                    <select id="filter-genre" onchange="applyFilters()" class="flex-1 input-styled rounded-xl p-2.5 text-sm appearance-none bg-no-repeat bg-[right_0.75rem_center] bg-[length:1em_1em]" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%236b7280%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E');">
                        <option value="all">全ジャンル</option>
                    </select>
                </div>
            </div>

            <!-- カードエリア -->
            <div id="no-cards-message" class="hidden flex-1 flex flex-col items-center justify-center text-[var(--text-muted)]">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <p>対象のカードがありません</p>
            </div>

            <div id="card-area" class="flex-1 flex flex-col justify-center perspective-1000 w-full max-w-md mx-auto">
                <!-- 3Dカード本体 -->
                <div id="flashcard" class="relative w-full aspect-[3/4] max-h-[60vh] preserve-3d card-inner cursor-pointer" onclick="flipCard()">
                    
                    <!-- 表面 -->
                    <div class="absolute inset-0 w-full h-full backface-hidden app-card flashcard-surface rounded-[2rem] flex flex-col items-center justify-center p-8 text-center">
                        <span id="card-genre" class="absolute top-6 left-6 text-xs font-bold px-3 py-1 rounded-full text-white" style="background-color: var(--primary);">Genre</span>
                        <div class="absolute top-6 right-6 text-xl font-bold px-3 py-1 rounded-full bg-[var(--primary-light)] text-[var(--primary)]" id="card-front-mastery"></div>
                        
                        <h2 id="card-front" class="text-4xl md:text-5xl font-bold mb-6 break-words w-full text-[var(--text-main)] leading-tight">Word</h2>
                        
                        <div class="absolute bottom-8 flex items-center gap-2 text-[var(--text-muted)] opacity-60">
                            <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            <span class="text-sm font-medium tracking-wide uppercase">Tap to flip</span>
                        </div>
                    </div>

                    <!-- 裏面 -->
                    <div class="absolute inset-0 w-full h-full backface-hidden app-card flashcard-surface rounded-[2rem] flex flex-col p-6 text-center rotate-y-180">
                        <div class="flex-1 flex items-center justify-center">
                            <h3 id="card-back" class="text-3xl font-medium break-words w-full text-[var(--text-main)]">Meaning</h3>
                        </div>
                        
                        <!-- 習得率スライダー -->
                        <div class="mt-auto pt-6 border-t border-[var(--border)]" onclick="event.stopPropagation()">
                            <div class="flex items-center justify-between mb-3">
                                <label for="study-mastery-slider" class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">習得率</label>
                                <output id="study-mastery-value" for="study-mastery-slider" class="text-sm font-bold text-[var(--primary)]">0%</output>
                            </div>
                            <input id="study-mastery-slider" type="range" min="0" max="100" step="10"
                                oninput="setMastery(this.value)" aria-label="習得率" class="w-full accent-[var(--primary)] cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- ナビゲーション -->
                <div class="flex justify-center items-center mt-10 gap-6">
                    <button onclick="prevCard()" class="p-4 rounded-full app-card hover:scale-110 active:scale-95 transition-transform text-[var(--text-main)]">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button onclick="nextCard()" class="p-4 rounded-full app-card hover:scale-110 active:scale-95 transition-transform text-white" style="background-color: var(--primary); border-color: var(--primary);">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==========================================
             View 2: Playlists (プレイリスト管理)
        =========================================== -->
        <div id="view-playlists" class="hidden space-y-6 pb-8 view-section">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-[var(--text-muted)]">プレイリスト</h2>
                <button onclick="openPlaylistModal()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-white font-semibold text-sm shadow-lg hover:opacity-90 active:scale-95 transition-all" style="background-color: var(--primary);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    新規作成
                </button>
            </div>
            <div id="manage-playlist-container" class="space-y-4">
                <!-- JS生成 -->
            </div>
        </div>

        <!-- ==========================================
             View 3: Words (単語管理)
        =========================================== -->
        <div id="view-words" class="hidden space-y-4 h-full flex flex-col view-section">
            <div class="flex justify-between items-center shrink-0">
                <h2 class="text-lg font-semibold text-[var(--text-muted)]">単語一覧</h2>
                <button onclick="openWordModal()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-white font-semibold text-sm shadow-lg hover:opacity-90 active:scale-95 transition-all" style="background-color: var(--primary);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    追加
                </button>
            </div>
            <div class="shrink-0 mb-2">
                <select id="manage-word-filter" onchange="renderManageWords()" class="w-full input-styled rounded-xl p-3 text-sm font-medium appearance-none bg-no-repeat bg-[right_1rem_center] bg-[length:1em_1em]" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%236b7280%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E');">
                    <option value="all">全てのプレイリスト</option>
                </select>
            </div>
            <div id="manage-word-container" class="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-6">
                <!-- JS生成 -->
            </div>
        </div>

        <!-- ==========================================
             View 4: Settings (設定)
        =========================================== -->
        <div id="view-settings" class="hidden space-y-8 pb-8 view-section">
            <h2 class="text-lg font-semibold text-[var(--text-muted)]">設定</h2>
            
            <div class="app-card p-6 rounded-2xl">
                <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)] mb-4">カラーテーマ</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setTheme('light')" class="py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 font-medium hover:ring-2 hover:ring-offset-2 ring-blue-500 transition-all">Light</button>
                    <button onclick="setTheme('dark')" class="py-3 rounded-xl border border-gray-700 bg-gray-900 text-gray-100 font-medium hover:ring-2 hover:ring-offset-2 hover:ring-offset-gray-900 ring-indigo-500 transition-all">Dark</button>
                    <button onclick="setTheme('pastel')" class="py-3 rounded-xl border border-pink-200 bg-pink-50 text-pink-700 font-medium hover:ring-2 hover:ring-offset-2 ring-pink-400 transition-all">Pastel</button>
                    <button onclick="setTheme('neon')" class="py-3 rounded-xl border border-cyan-500 bg-black text-cyan-400 font-medium hover:ring-2 hover:ring-offset-2 hover:ring-offset-black ring-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all">Neon</button>
                </div>
            </div>

            <div class="app-card p-6 rounded-2xl space-y-4">
                <div>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)] mb-2">カスタムテーマ</h3>
                    <label for="custom-theme-select" class="block text-sm font-medium mb-2">保存済みテーマ</label>
                    <select id="custom-theme-select" onchange="selectCustomTheme(this.value)" class="w-full input-styled rounded-xl p-3 text-sm">
                        <option value="">新しいテーマを作成</option>
                    </select>
                </div>
                <div>
                    <label for="custom-theme-name" class="block text-sm font-medium mb-2">テーマ名</label>
                    <input id="custom-theme-name" type="text" maxlength="40" class="w-full input-styled rounded-xl p-3 text-sm" placeholder="例：Ocean">
                </div>
                <div id="custom-theme-colors" class="space-y-3"></div>
                <p class="text-xs text-[var(--text-muted)]">色を変更するとプレビューされます。保存するとテーマ一覧に追加・更新されます。</p>
                <div class="flex gap-3">
                    <button onclick="saveCustomTheme()" class="flex-1 py-3 rounded-xl text-white font-semibold transition-opacity hover:opacity-90" style="background-color: var(--primary);">テーマを保存</button>
                    <button id="delete-custom-theme" onclick="deleteCustomTheme()" class="hidden px-4 py-3 rounded-xl border border-red-300 text-red-500 font-semibold">削除</button>
                </div>
            </div>

            <div class="app-card p-6 rounded-2xl">
                <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)] mb-4">フォントスタイル</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--primary-light)] transition-colors">
                        <span class="font-sans font-medium">Standard (Sans-serif)</span>
                        <input type="radio" name="font" value="font-sans" onchange="setFont(this.value)" class="w-5 h-5 accent-[var(--primary)]">
                    </label>
                    <label class="flex items-center justify-between p-4 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--primary-light)] transition-colors">
                        <span class="font-serif font-medium">Elegant (Serif)</span>
                        <input type="radio" name="font" value="font-serif" onchange="setFont(this.value)" class="w-5 h-5 accent-[var(--primary)]">
                    </label>
                    <label class="flex items-center justify-between p-4 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--primary-light)] transition-colors">
                        <span class="font-rounded font-medium">Friendly (Rounded)</span>
                        <input type="radio" name="font" value="font-rounded" onchange="setFont(this.value)" class="w-5 h-5 accent-[var(--primary)]">
                    </label>
                    <label class="flex items-center justify-between p-4 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--primary-light)] transition-colors">
                        <span class="font-jp-gothic font-medium">日本語ゴシック</span>
                        <input type="radio" name="font" value="font-jp-gothic" onchange="setFont(this.value)" class="w-5 h-5 accent-[var(--primary)]">
                    </label>
                    <label class="flex items-center justify-between p-4 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--primary-light)] transition-colors">
                        <span class="font-jp-mincho font-medium">日本語明朝</span>
                        <input type="radio" name="font" value="font-jp-mincho" onchange="setFont(this.value)" class="w-5 h-5 accent-[var(--primary)]">
                    </label>
                </div>
            </div>

            <div class="app-card p-6 rounded-2xl space-y-5">
                <h3 class="text-sm font-bold uppercase tracking-wider text-[var(--text-muted)]">カードの文字サイズ</h3>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="card-front-font-scale" class="text-sm font-medium">表面</label>
                        <output id="card-front-font-scale-value" for="card-front-font-scale" class="text-sm font-bold text-[var(--primary)]">100%</output>
                    </div>
                    <input id="card-front-font-scale" type="range" min="75" max="150" step="5"
                        oninput="setCardFontScale('front', this.value)" aria-label="カード表面の文字サイズ"
                        class="w-full accent-[var(--primary)] cursor-pointer">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="card-back-font-scale" class="text-sm font-medium">裏面</label>
                        <output id="card-back-font-scale-value" for="card-back-font-scale" class="text-sm font-bold text-[var(--primary)]">100%</output>
                    </div>
                    <input id="card-back-font-scale" type="range" min="75" max="150" step="5"
                        oninput="setCardFontScale('back', this.value)" aria-label="カード裏面の文字サイズ"
                        class="w-full accent-[var(--primary)] cursor-pointer">
                </div>
                <p class="text-xs text-[var(--text-muted)]">設定は表面・裏面それぞれに適用され、保存されます。</p>
            </div>

                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

    <!-- カスタムトースト通知 -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-[var(--text-main)] text-[var(--bg-base)] px-6 py-3 rounded-full shadow-2xl z-[70] font-medium text-sm transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        Message
    </div>

    <script>
        // --- データの初期化 ---
        const SAMPLE_DATA = {
            playlists: [
                { id: 'p1', name: '基本英単語 (TOEIC)' },
                { id: 'p2', name: '日常会話フレーズ' }
            ],
            cards: [
                { id: 'c1', playlistId: 'p1', front: 'Accommodate', back: '収容する、適応させる', genre: '動詞', mastery: 0 },
                { id: 'c2', playlistId: 'p1', front: 'Substantial', back: 'かなりの、実質的な', genre: '形容詞', mastery: 1 },
                { id: 'c3', playlistId: 'p1', front: 'Implement', back: '実行する、導入する', genre: '動詞', mastery: 2 },
                { id: 'c5', playlistId: 'p2', front: 'How\'s it going?', back: '調子はどう？', genre: '挨拶', mastery: 2 },
                { id: 'c6', playlistId: 'p2', front: 'Make sense', back: '理にかなっている', genre: '熟語', mastery: 0 }
            ],
            settings: { theme: 'light', font: 'font-sans', cardFrontFontScale: 100, cardBackFontScale: 100 }
        };

        const CUSTOM_THEME_DEFAULTS = {
            bgBase: '#f3f4f6',
            bgCard: '#ffffff',
            bgNav: '#ffffff',
            textMain: '#1f2937',
            textMuted: '#6b7280',
            primary: '#4f46e5',
            primaryLight: '#e0e7ff',
            border: '#e5e7eb',
            shadowCard: '#000000',
            shadowFlip: '#000000'
        };
        const CUSTOM_THEME_COLORS = [
            { key: 'bgBase', property: '--bg-base', label: '背景' },
            { key: 'bgCard', property: '--bg-card', label: 'カード背景' },
            { key: 'bgNav', property: '--bg-nav', label: 'ナビゲーション背景' },
            { key: 'textMain', property: '--text-main', label: '文字（メイン）' },
            { key: 'textMuted', property: '--text-muted', label: '文字（補助）' },
            { key: 'primary', property: '--primary', label: 'アクセント' },
            { key: 'primaryLight', property: '--primary-light', label: 'アクセント背景' },
            { key: 'border', property: '--border', label: '境界線' },
            { key: 'shadowCard', property: '--shadow-card', label: 'カードの影' },
            { key: 'shadowFlip', property: '--shadow-flip', label: 'フリップの影' }
        ];

        let state = null;
        let customThemeDraft = { ...CUSTOM_THEME_DEFAULTS };
        let customThemeDraftId = null;
        let studySession = { activePlaylistId: null, filteredCards: [], currentIndex: 0, isFlipped: false, isRandom: false };

        function init() {
            loadData();
            renderCustomThemeEditor();
            applySettings();
            navigate('learn');
        }

        function loadData() {
            const saved = localStorage.getItem('modernFlashcardApp');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    state = JSON.parse(JSON.stringify(SAMPLE_DATA));
                }
            } else {
                state = JSON.parse(JSON.stringify(SAMPLE_DATA));
            }
            
            // 安全な初期化 (Cannot read properties of undefined 対策)
            if (!state) state = { playlists: [], cards: [], settings: {} };
            if (!state.playlists) state.playlists = [];
            if (!state.cards) state.cards = [];
            state.cards.forEach(card => { card.mastery = normalizeMastery(card.mastery); });
            if (!state.settings) state.settings = { theme: 'light', font: 'font-sans' };
            if (!state.settings.theme) state.settings.theme = 'light';
            const supportedFonts = ['font-sans', 'font-serif', 'font-rounded', 'font-jp-gothic', 'font-jp-mincho'];
            if (!supportedFonts.includes(state.settings.font)) state.settings.font = 'font-sans';
            state.settings.cardFrontFontScale = normalizeCardFontScale(state.settings.cardFrontFontScale);
            state.settings.cardBackFontScale = normalizeCardFontScale(state.settings.cardBackFontScale);
            if (!Array.isArray(state.settings.customThemes)) state.settings.customThemes = [];
            state.settings.customThemes = state.settings.customThemes
                .filter(theme => theme && typeof theme.id === 'string' && typeof theme.name === 'string')
                .map(theme => ({ id: theme.id, name: theme.name, colors: normalizeCustomThemeColors(theme.colors) }));
            if (!state.settings.customThemes.some(theme => theme.id === state.settings.activeCustomThemeId)) {
                state.settings.activeCustomThemeId = null;
                if (state.settings.theme === 'custom') state.settings.theme = 'light';
            }
            
            saveData();
        }

        function normalizeMastery(value) {
            const numericValue = Number(value);
            if (numericValue === 1) return 50;
            if (numericValue === 2) return 100;
            if (!Number.isFinite(numericValue)) return 0;
            return Math.min(100, Math.max(0, Math.round(numericValue / 10) * 10));
        }

        function normalizeCustomThemeColors(colors) {
            const normalized = { ...CUSTOM_THEME_DEFAULTS };
            if (!colors || typeof colors !== 'object') return normalized;
            CUSTOM_THEME_COLORS.forEach(({ key }) => {
                if (isHexColor(colors[key])) normalized[key] = colors[key];
            });
            return normalized;
        }

        function isHexColor(value) {
            return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value);
        }

        function renderCustomThemeEditor() {
            const select = document.getElementById('custom-theme-select');
            const colorContainer = document.getElementById('custom-theme-colors');
            select.querySelectorAll('option:not(:first-child)').forEach(option => option.remove());
            state.settings.customThemes.forEach(theme => {
                const option = document.createElement('option');
                option.value = theme.id;
                option.textContent = theme.name;
                select.appendChild(option);
            });
            colorContainer.innerHTML = CUSTOM_THEME_COLORS.map(({ key, label }) => `
                <label class="flex items-center justify-between gap-3 text-sm">
                    <span>${label}</span>
                    <span class="flex items-center gap-2">
                        <input type="color" data-color-key="${key}" aria-label="${label}の色"
                            oninput="updateCustomThemeColor('${key}', this.value, 'picker')"
                            class="w-10 h-10 rounded-lg border border-[var(--border)] bg-transparent cursor-pointer">
                        <input type="text" data-hex-key="${key}" aria-label="${label}の16進カラーコード"
                            oninput="updateCustomThemeColor('${key}', this.value, 'hex')"
                            maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#RRGGBB"
                            class="w-24 input-styled rounded-lg p-2 text-xs font-mono uppercase">
                    </span>
                </label>
            `).join('');

            const activeTheme = state.settings.customThemes.find(theme => theme.id === state.settings.activeCustomThemeId);
            customThemeDraftId = activeTheme ? activeTheme.id : null;
            customThemeDraft = activeTheme ? { ...activeTheme.colors } : { ...CUSTOM_THEME_DEFAULTS };
            select.value = customThemeDraftId || '';
            document.getElementById('custom-theme-name').value = activeTheme ? activeTheme.name : '';
            document.getElementById('delete-custom-theme').classList.toggle('hidden', !activeTheme);
            syncCustomThemeInputs();
        }

        function syncCustomThemeInputs() {
            CUSTOM_THEME_COLORS.forEach(({ key }) => {
                document.querySelector(`[data-color-key="${key}"]`).value = customThemeDraft[key];
                const hexInput = document.querySelector(`[data-hex-key="${key}"]`);
                hexInput.value = customThemeDraft[key];
                hexInput.classList.remove('border-red-500');
                hexInput.removeAttribute('aria-invalid');
            });
        }

        function selectCustomTheme(id) {
            const theme = state.settings.customThemes.find(item => item.id === id);
            customThemeDraftId = theme ? theme.id : null;
            customThemeDraft = theme ? { ...theme.colors } : { ...CUSTOM_THEME_DEFAULTS };
            document.getElementById('custom-theme-name').value = theme ? theme.name : '';
            document.getElementById('delete-custom-theme').classList.toggle('hidden', !theme);
            syncCustomThemeInputs();
            if (theme) {
                state.settings.activeCustomThemeId = theme.id;
                state.settings.theme = 'custom';
                saveData();
            }
            if (theme) applySettings();
            else applyCustomThemeColors(customThemeDraft);
        }

        function updateCustomThemeColor(key, value, source) {
            const field = CUSTOM_THEME_COLORS.find(color => color.key === key);
            if (!field) return;
            const hexInput = document.querySelector(`[data-hex-key="${key}"]`);
            if (!isHexColor(value)) {
                if (source === 'hex') {
                    hexInput.classList.add('border-red-500');
                    hexInput.setAttribute('aria-invalid', 'true');
                }
                return;
            }
            const normalized = value.toLowerCase();
            customThemeDraft[key] = normalized;
            document.querySelector(`[data-color-key="${key}"]`).value = normalized;
            hexInput.value = normalized;
            hexInput.classList.remove('border-red-500');
            hexInput.removeAttribute('aria-invalid');
            applyCustomThemeColors(customThemeDraft);
        }

        function applyCustomThemeColors(colors) {
            document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
            CUSTOM_THEME_COLORS.forEach(({ key, property }) => {
                let value = colors[key];
                if (key === 'bgNav') value = hexToRgb(colors[key], 0.85);
                if (key === 'shadowCard') {
                    value = `0 10px 25px -5px ${hexToRgb(colors[key], 0.08)}, 0 8px 10px -6px ${hexToRgb(colors[key], 0.02)}`;
                }
                if (key === 'shadowFlip') value = `0 25px 50px -12px ${hexToRgb(colors[key], 0.15)}`;
                document.body.style.setProperty(property, value);
            });
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.content = colors.bgBase;
        }

        function hexToRgb(hex, alpha) {
            const value = hex.slice(1);
            const red = parseInt(value.slice(0, 2), 16);
            const green = parseInt(value.slice(2, 4), 16);
            const blue = parseInt(value.slice(4, 6), 16);
            return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
        }

        function saveCustomTheme() {
            const name = document.getElementById('custom-theme-name').value.trim();
            if (!name) return showToast('テーマ名を入力してください');
            if (document.querySelector('[aria-invalid="true"]')) return showToast('カラーコードを確認してください');

            let theme = state.settings.customThemes.find(item => item.id === customThemeDraftId);
            if (theme) {
                theme.name = name;
                theme.colors = { ...customThemeDraft };
            } else {
                theme = { id: generateId(), name, colors: { ...customThemeDraft } };
                state.settings.customThemes.push(theme);
                customThemeDraftId = theme.id;
            }
            state.settings.activeCustomThemeId = theme.id;
            state.settings.theme = 'custom';
            saveData();
            renderCustomThemeEditor();
            applySettings();
            showToast('カスタムテーマを保存しました');
        }

        function deleteCustomTheme() {
            if (!customThemeDraftId) return;
            showConfirm('テーマ削除', 'このカスタムテーマを削除しますか？', () => {
                state.settings.customThemes = state.settings.customThemes.filter(theme => theme.id !== customThemeDraftId);
                state.settings.activeCustomThemeId = null;
                state.settings.theme = 'light';
                saveData();
                renderCustomThemeEditor();
                applySettings();
                showToast('カスタムテーマを削除しました');
            });
        }

        function saveData() {
            localStorage.setItem('modernFlashcardApp', JSON.stringify(state));
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        // --- カスタム UI コンポーネント (alert/confirm の代替) ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2500);
        }

        let confirmCallback = null;
        function showConfirm(title, msg, callback) {
            confirmCallback = callback;
            document.getElementById('dialog-confirm-title').textContent = title;
            document.getElementById('dialog-confirm-msg').textContent = msg;
            
            const dialog = document.getElementById('dialog-confirm');
            const content = document.getElementById('dialog-confirm-content');
            dialog.classList.remove('hidden');
            
            // アニメーション用
            requestAnimationFrame(() => {
                dialog.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });

            document.getElementById('dialog-confirm-btn').onclick = () => {
                closeConfirm();
                if(confirmCallback) confirmCallback();
            };
        }

        function closeConfirm() {
            const dialog = document.getElementById('dialog-confirm');
            const content = document.getElementById('dialog-confirm-content');
            dialog.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => { dialog.classList.add('hidden'); }, 300);
        }

        function confirmReset() {
            showConfirm('データ初期化', '全てのデータと設定が消去されます。よろしいですか？', () => {
                localStorage.removeItem('modernFlashcardApp');
                location.reload();
            });
        }

        // --- ナビゲーション ---
        function navigate(target) {
            const views = ['learn', 'study', 'playlists', 'words', 'settings'];
            views.forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
            });
            
            // ナビゲーションボタンのアクティブ状態更新
            ['learn', 'playlists', 'words', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if(btn) {
                    btn.classList.remove('text-[var(--primary)]');
                    btn.querySelector('.icon-wrapper').classList.remove('bg-[var(--primary-light)]');
                }
            });

            document.getElementById(`view-${target}`).classList.remove('hidden');
            
            // Study画面の場合はLearnをアクティブにする
            const activeNav = target === 'study' ? 'learn' : target;
            const activeBtn = document.getElementById(`nav-${activeNav}`);
            if(activeBtn) {
                activeBtn.classList.add('text-[var(--primary)]');
                activeBtn.querySelector('.icon-wrapper').classList.add('bg-[var(--primary-light)]');
            }

            // 画面ごとのレンダリング
            if (target === 'learn') renderLearn();
            if (target === 'playlists') renderPlaylists();
            if (target === 'words') { updateWordFilterOptions(); renderManageWords(); }
            if (target === 'settings') {
                const fRadio = document.querySelector(`input[name="font"][value="${state.settings.font}"]`);
                if(fRadio) fRadio.checked = true;
            }
        }

        // --- Learn / Study ---
        function renderLearn() {
            const container = document.getElementById('learn-playlist-container');
            container.innerHTML = '';
            
            if(state.playlists.length === 0) {
                container.innerHTML = `
                    <div class="app-card p-8 rounded-2xl text-center flex flex-col items-center">
                        <div class="w-16 h-16 bg-[var(--primary-light)] text-[var(--primary)] rounded-full flex items-center justify-center mb-4"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></div>
                        <p class="text-[var(--text-muted)] font-medium mb-4">プレイリストがありません</p>
                        <button onclick="navigate('playlists')" class="text-[var(--primary)] font-bold">作成する</button>
                    </div>`;
                return;
            }

            state.playlists.forEach(pl => {
                const cards = state.cards.filter(c => c.playlistId === pl.id);
                const progress = cards.length
                    ? Math.round(cards.reduce((total, card) => total + card.mastery, 0) / cards.length)
                    : 0;

                const el = document.createElement('div');
                el.className = 'app-card p-5 rounded-2xl cursor-pointer hover:scale-[1.02] active:scale-[0.98] transition-transform';
                el.onclick = () => startStudy(pl.id);
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-[var(--text-main)]">${pl.name}</h3>
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-[var(--primary-light)] text-[var(--primary)]">${cards.length} Cards</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-full bg-[var(--border)] rounded-full h-2.5 overflow-hidden">
                            <div class="bg-[var(--primary)] h-full rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                        <span class="text-sm font-bold text-[var(--text-muted)] min-w-[3rem] text-right">${progress}%</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function startStudy(playlistId) {
            studySession.activePlaylistId = playlistId;
            const pCards = state.cards.filter(c => c.playlistId === playlistId);
            
            const genres = [...new Set(pCards.map(c => c.genre).filter(Boolean))];
            const gSelect = document.getElementById('filter-genre');
            gSelect.innerHTML = '<option value="all">全ジャンル</option>';
            genres.forEach(g => { gSelect.innerHTML += `<option value="${g}">${g}</option>`; });

            document.getElementById('filter-mastery').value = 'all';
            document.getElementById('filter-genre').value = 'all';

            applyFilters();
            navigate('study');
        }

        function applyFilters() {
            const mFilter = document.getElementById('filter-mastery').value;
            const gFilter = document.getElementById('filter-genre').value;
            
            let filtered = state.cards.filter(c => c.playlistId === studySession.activePlaylistId);
            if (mFilter !== 'all') filtered = filtered.filter(c => c.mastery === parseInt(mFilter, 10));
            if (gFilter !== 'all') filtered = filtered.filter(c => c.genre === gFilter);

            if (studySession.isRandom) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
            }

            studySession.filteredCards = filtered;
            studySession.currentIndex = 0;
            studySession.isFlipped = false;
            
            renderStudyCard();
        }

        function renderStudyCard() {
            const cardArea = document.getElementById('card-area');
            const noMsg = document.getElementById('no-cards-message');
            const flashcard = document.getElementById('flashcard');
            const randomButton = document.getElementById('toggle-random');

            flashcard.classList.remove('rotate-y-180');
            studySession.isFlipped = false;
            randomButton.setAttribute('aria-pressed', String(studySession.isRandom));
            randomButton.setAttribute('aria-label', `ランダム再生を${studySession.isRandom ? '無効' : '有効'}にする`);
            randomButton.style.backgroundColor = studySession.isRandom ? 'var(--primary)' : '';
            randomButton.style.borderColor = studySession.isRandom ? 'var(--primary)' : '';
            randomButton.classList.toggle('text-white', studySession.isRandom);
            randomButton.classList.toggle('text-[var(--text-muted)]', !studySession.isRandom);

            if (studySession.filteredCards.length === 0) {
                cardArea.classList.add('hidden');
                noMsg.classList.remove('hidden');
                document.getElementById('study-progress').textContent = '0 / 0';
                return;
            }

            cardArea.classList.remove('hidden');
            noMsg.classList.add('hidden');

            const card = studySession.filteredCards[studySession.currentIndex];
            document.getElementById('card-front').textContent = card.front;
            document.getElementById('card-back').textContent = card.back;
            
            const genreEl = document.getElementById('card-genre');
            if (card.genre) { genreEl.textContent = card.genre; genreEl.style.display = 'block'; } 
            else { genreEl.style.display = 'none'; }

            document.getElementById('card-front-mastery').textContent = `${card.mastery}%`;
            document.getElementById('study-progress').textContent = `${studySession.currentIndex + 1} / ${studySession.filteredCards.length}`;

            updateMasteryUI(card.mastery);
        }

        function flipCard() {
            studySession.isFlipped = !studySession.isFlipped;
            document.getElementById('flashcard').classList.toggle('rotate-y-180', studySession.isFlipped);
        }

        function nextCard() {
            if (studySession.filteredCards.length === 0) return;
            studySession.currentIndex = (studySession.currentIndex + 1) % studySession.filteredCards.length;
            renderStudyCard();
        }

        function toggleRandomPlayback() {
            studySession.isRandom = !studySession.isRandom;
            applyFilters();
        }

        function prevCard() {
            if (studySession.filteredCards.length === 0) return;
            studySession.currentIndex = (studySession.currentIndex - 1 + studySession.filteredCards.length) % studySession.filteredCards.length;
            renderStudyCard();
        }

        function setMastery(level) {
            const card = studySession.filteredCards[studySession.currentIndex];
            const percentage = normalizeMastery(level);
            card.mastery = percentage;
            
            const idx = state.cards.findIndex(c => c.id === card.id);
            if(idx !== -1) {
                state.cards[idx].mastery = percentage;
                saveData();
            }
            updateMasteryUI(percentage);
        }

        function updateMasteryUI(percentage) {
            document.getElementById('study-mastery-slider').value = percentage;
            document.getElementById('study-mastery-value').textContent = `${percentage}%`;
            document.getElementById('card-front-mastery').textContent = `${percentage}%`;
        }

        function updateWordMasteryValue(percentage) {
            document.getElementById('modal-word-mastery-value').textContent = `${normalizeMastery(percentage)}%`;
        }

        // --- Playlists Management ---
        function renderPlaylists() {
            const container = document.getElementById('manage-playlist-container');
            container.innerHTML = '';
            state.playlists.forEach(pl => {
                const count = state.cards.filter(c => c.playlistId === pl.id).length;
                const el = document.createElement('div');
                el.className = 'app-card p-4 rounded-2xl flex justify-between items-center';
                el.innerHTML = `
                    <div>
                        <h4 class="font-bold text-lg text-[var(--text-main)]">${pl.name}</h4>
                        <p class="text-sm font-medium text-[var(--text-muted)]">${count} Cards</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openPlaylistModal('${pl.id}')" class="p-3 rounded-xl bg-[var(--primary-light)] text-[var(--primary)] hover:scale-105 active:scale-95 transition-transform"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="reqDeletePlaylist('${pl.id}')" class="p-3 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-500 hover:scale-105 active:scale-95 transition-transform"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function openPlaylistModal(id = null) {
            const modal = document.getElementById('modal-playlist');
            const content = document.getElementById('modal-playlist-content');
            modal.classList.remove('hidden');
            
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });

            if (id) {
                const pl = state.playlists.find(p => p.id === id);
                document.getElementById('modal-playlist-title').textContent = 'プレイリスト編集';
                document.getElementById('modal-playlist-id').value = pl.id;
                document.getElementById('modal-playlist-name').value = pl.name;
            } else {
                document.getElementById('modal-playlist-title').textContent = '新規プレイリスト';
                document.getElementById('modal-playlist-id').value = '';
                document.getElementById('modal-playlist-name').value = '';
            }
        }

        function savePlaylist() {
            const id = document.getElementById('modal-playlist-id').value;
            const name = document.getElementById('modal-playlist-name').value.trim();
            if(!name) return showToast('名前を入力してください');
            
            if (id) {
                const pl = state.playlists.find(p => p.id === id);
                if(pl) pl.name = name;
                showToast('更新しました');
            } else {
                state.playlists.push({ id: generateId(), name });
                showToast('作成しました');
            }
            saveData();
            closeModal('modal-playlist');
            renderPlaylists();
        }

        function reqDeletePlaylist(id) {
            showConfirm('プレイリスト削除', 'このリストと含まれる全ての単語を削除しますか？', () => {
                state.playlists = state.playlists.filter(p => p.id !== id);
                state.cards = state.cards.filter(c => c.playlistId !== id);
                saveData();
                renderPlaylists();
                showToast('削除しました');
            });
        }

        // --- Words Management ---
        function updateWordFilterOptions() {
            const sel = document.getElementById('manage-word-filter');
            sel.innerHTML = '<option value="all">全てのプレイリスト</option>';
            state.playlists.forEach(pl => {
                sel.innerHTML += `<option value="${pl.id}">${pl.name}</option>`;
            });
        }

        function renderManageWords() {
            const container = document.getElementById('manage-word-container');
            const fId = document.getElementById('manage-word-filter').value;
            container.innerHTML = '';
            
            let dCards = state.cards;
            if (fId !== 'all') dCards = dCards.filter(c => c.playlistId === fId);

            dCards.forEach(c => {
                const pl = state.playlists.find(p => p.id === c.playlistId);
                const plName = pl ? pl.name : 'Unknown';

                const el = document.createElement('div');
                el.className = 'app-card p-4 rounded-2xl flex justify-between items-center gap-3';
                el.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex gap-2 items-center mb-2">
                            <span class="text-[10px] font-bold tracking-wider uppercase bg-[var(--border)] text-[var(--text-muted)] px-2 py-1 rounded truncate max-w-[100px]">${plName}</span>
                            <span class="text-xs font-bold text-[var(--primary)]">${c.mastery}%</span>
                        </div>
                        <p class="font-bold text-lg text-[var(--text-main)] truncate">${c.front}</p>
                        <p class="text-sm font-medium text-[var(--text-muted)] truncate">${c.back}</p>
                    </div>
                    <div class="flex flex-col gap-2 shrink-0">
                        <button onclick="openWordModal('${c.id}')" class="p-2.5 rounded-xl bg-[var(--primary-light)] text-[var(--primary)] hover:scale-105 active:scale-95 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="reqDeleteWord('${c.id}')" class="p-2.5 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-500 hover:scale-105 active:scale-95 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function openWordModal(id = null) {
            if(state.playlists.length === 0) return showToast('先にプレイリストを作成してください');
            
            const modal = document.getElementById('modal-word');
            const content = document.getElementById('modal-word-content');
            modal.classList.remove('hidden');
            
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });

            const sel = document.getElementById('modal-word-playlist');
            sel.innerHTML = '';
            state.playlists.forEach(pl => { sel.innerHTML += `<option value="${pl.id}">${pl.name}</option>`; });

            if (id) {
                const c = state.cards.find(x => x.id === id);
                document.getElementById('modal-word-title').textContent = '単語編集';
                document.getElementById('modal-word-id').value = c.id;
                sel.value = c.playlistId;
                document.getElementById('modal-word-front').value = c.front;
                document.getElementById('modal-word-back').value = c.back;
                document.getElementById('modal-word-genre').value = c.genre || '';
                document.getElementById('modal-word-mastery').value = c.mastery;
                updateWordMasteryValue(c.mastery);
            } else {
                document.getElementById('modal-word-title').textContent = '新規単語';
                document.getElementById('modal-word-id').value = '';
                document.getElementById('modal-word-front').value = '';
                document.getElementById('modal-word-back').value = '';
                document.getElementById('modal-word-genre').value = '';
                document.getElementById('modal-word-mastery').value = '0';
                updateWordMasteryValue(0);
                
                const curF = document.getElementById('manage-word-filter').value;
                if(curF !== 'all') sel.value = curF;
            }
        }

        function saveWord() {
            const id = document.getElementById('modal-word-id').value;
            const playlistId = document.getElementById('modal-word-playlist').value;
            const front = document.getElementById('modal-word-front').value.trim();
            const back = document.getElementById('modal-word-back').value.trim();
            const genre = document.getElementById('modal-word-genre').value.trim();
            const mastery = normalizeMastery(document.getElementById('modal-word-mastery').value);

            if(!front || !back) return showToast('単語と意味を入力してください');

            if (id) {
                const c = state.cards.find(x => x.id === id);
                if(c) {
                    c.playlistId = playlistId; c.front = front; c.back = back; c.genre = genre; c.mastery = mastery;
                }
                showToast('更新しました');
            } else {
                state.cards.push({ id: generateId(), playlistId, front, back, genre, mastery });
                showToast('追加しました');
            }
            saveData();
            closeModal('modal-word');
            renderManageWords();
        }

        function reqDeleteWord(id) {
            showConfirm('単語の削除', 'この単語を削除しますか？', () => {
                state.cards = state.cards.filter(c => c.id !== id);
                saveData();
                renderManageWords();
                showToast('削除しました');
            });
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(`${modalId}-content`);
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // --- 設定管理 ---
        function setTheme(t) {
            state.settings.theme = t;
            saveData();
            applySettings();
            showToast(`${t.charAt(0).toUpperCase() + t.slice(1)} テーマを適用しました`);
        }

        function setFont(f) {
            state.settings.font = f;
            saveData();
            applySettings();
        }

        function normalizeCardFontScale(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return 100;
            return Math.min(150, Math.max(75, Math.round(numericValue / 5) * 5));
        }

        function setCardFontScale(side, value) {
            if (side !== 'front' && side !== 'back') return;
            state.settings[`card${side === 'front' ? 'Front' : 'Back'}FontScale`] = normalizeCardFontScale(value);
            applyCardFontSizes();
            saveData();
        }

        function applyCardFontSizes() {
            if (!state) return;
            const frontScale = state.settings.cardFrontFontScale / 100;
            const backScale = state.settings.cardBackFontScale / 100;
            document.getElementById('card-front').style.fontSize =
                `${(window.innerWidth >= 768 ? 48 : 36) * frontScale}px`;
            document.getElementById('card-back').style.fontSize = `${30 * backScale}px`;

            ['front', 'back'].forEach(side => {
                const value = state.settings[`card${side === 'front' ? 'Front' : 'Back'}FontScale`];
                document.getElementById(`card-${side}-font-scale`).value = value;
                document.getElementById(`card-${side}-font-scale-value`).textContent = `${value}%`;
            });
        }

        function applySettings() {
            document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
            CUSTOM_THEME_COLORS.forEach(({ property }) => document.body.style.removeProperty(property));
            if (state.settings.theme === 'custom') {
                const activeTheme = state.settings.customThemes.find(theme => theme.id === state.settings.activeCustomThemeId);
                if (activeTheme) {
                    applyCustomThemeColors(activeTheme.colors);
                } else {
                    state.settings.theme = 'light';
                    state.settings.activeCustomThemeId = null;
                }
            } else if (state.settings.theme !== 'light') {
                document.body.classList.add(`theme-${state.settings.theme}`);
            }
            document.body.className = document.body.className.replace(/font-(sans|serif|rounded|jp-gothic|jp-mincho)/g, '').trim();
            document.body.classList.add(state.settings.font, 'h-screen', 'flex', 'flex-col', 'overflow-hidden');
            applyCardFontSizes();
            
            // モバイル環境でのテーマカラーメタタグ更新 (PWAライクな挙動のため)
            let metaTheme = document.querySelector('meta[name="theme-color"]');
            if(!metaTheme) {
                metaTheme = document.createElement('meta');
                metaTheme.name = "theme-color";
                document.head.appendChild(metaTheme);
            }
            const bgColors = { light: '#f3f4f6', dark: '#111827', pastel: '#fdf4f5', neon: '#09090b' };
            const activeTheme = state.settings.customThemes.find(theme => theme.id === state.settings.activeCustomThemeId);
            metaTheme.content = state.settings.theme === 'custom' && activeTheme
                ? activeTheme.colors.bgBase
                : (bgColors[state.settings.theme] || '#f3f4f6');
        }

        window.addEventListener('resize', applyCardFontSizes);
        window.onload = init;

    </script>
</body>
</html>
